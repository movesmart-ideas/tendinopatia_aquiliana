<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MoveSmart · Acceso a programas</title>
<style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#08090b;color:#f4f4f4;font:16px system-ui,-apple-system,Segoe UI,Arial,sans-serif}header{padding:25px 6%;border-bottom:1px solid #242424;font-size:24px;font-weight:800;letter-spacing:-1px}header span,.accent{color:#ff702a}main{max-width:590px;margin:7vh auto;padding:0 20px}.eyebrow{font-size:12px;color:#ff8246;font-weight:700;letter-spacing:2px}h1{font-size:clamp(31px,6vw,50px);letter-spacing:-1.6px;line-height:1.04;margin:12px 0 20px}p{color:#bbb;line-height:1.6}.card{background:#131417;border:1px solid #333;border-radius:18px;padding:26px;margin-top:24px}.field{display:block;font-size:14px;font-weight:700;margin-bottom:9px}input{width:100%;border:1px solid #454545;border-radius:9px;background:#08090b;padding:15px;color:#fff;font:inherit}button{background:#ff702a;border:0;padding:15px 20px;color:#100b08;font:inherit;font-weight:800;cursor:pointer;border-radius:9px;margin-top:18px;width:100%}button:disabled{opacity:.5;cursor:wait}.outline{border:1px solid #555;background:transparent;color:#fff}.notice{margin-top:18px;line-height:1.5;border-radius:9px;padding:14px;background:#222;border:1px solid #444;white-space:pre-wrap}.good{border-color:#48775d;background:#18291f}.bad{border-color:#99483a;background:#311c17}[hidden]{display:none!important}small{color:#b9b9b9}.footer{margin-top:25px;font-size:13px}.program-open{display:block;text-align:center;background:#ff702a;color:#100b08;text-decoration:none;font-weight:800;padding:16px;border-radius:9px;margin-top:20px}</style></head>
<body><header>Move<span>Smart</span></header><main><div class="eyebrow">MOVESMART · ACCESO CLIENTES</div><h1>Tus programas, <span class="accent">en un solo lugar.</span></h1><p>Ingresa con tu correo. Te enviaremos un enlace o código para identificarte sin contraseña.</p><div class="card"><form id="email-form"><label class="field" for="email">Correo electrónico</label><input id="email" type="email" autocomplete="email" placeholder="nombre@correo.com" required><button id="send" type="submit">Enviar acceso →</button></form><form id="code-form" hidden><label class="field" for="token">Código de 6 dígitos (si lo recibiste)</label><input id="token" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" placeholder="000000" required><button id="verify" type="submit">Confirmar código →</button><button type="button" class="outline" id="back">Cambiar correo</button></form><div id="account" hidden><p id="who"></p><div id="access"></div><button class="outline" id="logout">Cerrar sesión</button></div><div id="msg" class="notice" role="status" aria-live="polite" hidden></div></div><p class="footer">Esta es una prueba de acceso. No hay compras activadas. Solo las cuentas autorizadas por MoveSmart pueden acceder a un producto.</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const url='https://pssxcjgsoywfotxiyvmp.supabase.co',key='sb_publishable_FugLYst3_ql5eREo9SvPpA_HCum2WBg';
const redirectTo='https://movesmart-ideas.github.io/tendinopatia_aquiliana/';
const $=x=>document.getElementById(x),sb=window.supabase?.createClient(url,key);let currentEmail='';
function message(t,bad=false){$('msg').hidden=!t;$('msg').textContent=t||'';$('msg').className='notice '+(bad?'bad':'good')}
function step(n){$('email-form').hidden=n!==0;$('code-form').hidden=n!==1;$('account').hidden=n!==2}
async function loadAccess(){const {data:{user},error}=await sb.auth.getUser();if(error||!user){step(0);return}step(2);$('who').textContent='Sesión iniciada: '+(user.email||'usuario');const {data,error:err}=await sb.from('movesmart_accesos').select('producto_id,estado,comienza_en,vence_en').eq('usuario_id',user.id).eq('producto_id','aquiles-en-movimiento').maybeSingle();const enabled=data&&data.estado==='activo'&&Date.parse(data.comienza_en)<=Date.now()&&(!data.vence_en||Date.parse(data.vence_en)>Date.now());$('access').textContent=err?'No se pudo comprobar el acceso. Vuelve a intentarlo.':enabled?'Tu cuenta tiene acceso activo a Aquiles en Movimiento. Ya puedes continuar con tu programa.':'Tu correo está verificado, pero todavía no tienes acceso activo a Aquiles en Movimiento. Contacta a MoveSmart si ya compraste el programa.';if(enabled){const open=document.createElement('a');open.href='./programa.html';open.textContent='Abrir Aquiles en Movimiento →';open.className='program-open';$('access').appendChild(open);}message(err?'Error de verificación de permisos.':'Correo verificado correctamente.',!!err)}
$('email-form').addEventListener('submit',async ev=>{ev.preventDefault();if(!sb){message('No se cargó la conexión con Supabase. Comprueba tu conexión a Internet.',true);return}currentEmail=$('email').value.trim();$('send').disabled=true;try{const {error}=await sb.auth.signInWithOtp({email:currentEmail,options:{shouldCreateUser:true,emailRedirectTo:redirectTo}});if(error)throw error;step(1);message('Revisa tu correo. Si recibiste un enlace, abre el enlace de acceso más reciente. Si recibiste un código de 6 dígitos, ingrésalo aquí.')}catch(e){message(e.message||String(e),true)}finally{$('send').disabled=false}});
$('code-form').addEventListener('submit',async ev=>{ev.preventDefault();$('verify').disabled=true;try{const {error}=await sb.auth.verifyOtp({email:currentEmail,token:$('token').value.trim(),type:'email'});if(error)throw error;await loadAccess()}catch(e){message(e.message||String(e),true)}finally{$('verify').disabled=false}});
$('back').onclick=()=>{step(0);message('')};$('logout').onclick=async()=>{await sb.auth.signOut();step(0);message('Sesión cerrada.')};if(sb)loadAccess();else message('No se pudo cargar Supabase.',true);
</script></body></html>
